# GitHub Actions অটো-টেস্ট — প্রতিটি push/PR-এ static check + পুরো pytest চালায়।
#
# চালু করার নিয়ম (একবারই):
#   1. এই ফাইলটি GitHub-এ `.github/workflows/tests.yml` নামে রাখুন —
#      GitHub → repo → Add file → Create new file → নাম লিখুন
#      `.github/workflows/tests.yml` → নিচের পুরো কনটেন্ট পেস্ট → Commit.
#   2. কোনো সিক্রেট লাগে না: টেস্টগুলো stub বট + temp SQLite ব্যবহার করে।
#
# (রেপোতে `.github/workflows/` ফোল্ডারটি ইচ্ছাকৃতভাবে এখনো নেই; এই ফাইলটা
#  নাম বদলে ওখানে গেলেই CI চালু হয়ে যাবে।)
name: tests
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Static check (no syntax/import traps)
        run: python tools/static_check.py

      - name: Test suite
        run: python -m pytest -q
        env:
          BOT_TOKEN: "123456789:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
          API_ID: "12345"
          API_HASH: "00000000000000000000000000000000"
          ADMIN_IDS: "777"
